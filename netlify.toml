[build]
  publish = "frontend"

[[redirects]]
  from = "/api/v1/*"
  to = "https://schemesaathi-api.onrender.com/api/v1/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
