services:
  - type: web
    name: schemesaathi-api
    env: python
    region: singapore
    plan: starter
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && pip install gunicorn"
    startCommand: "gunicorn wsgi:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: schemesaathi-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "https://schemesaathi.netlify.app,https://schemesaathi.in"

databases:
  - name: schemesaathi-db
    plan: starter
    databaseName: schemesaathi
    user: schemesaathi
