<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login — SchemeSaathi AI</title>
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/navbar.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Manrope:wght@400..800&display=swap" rel="stylesheet">
  <style>
    .admin-auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--aubergine-900);
      padding: 2rem;
    }
    .admin-auth-card {
      width: 100%;
      max-width: 420px;
      background: var(--color-surface);
      border-radius: var(--radius-xl);
      padding: 2.5rem;
      box-shadow: var(--shadow-lg);
    }
  </style>
</head>
<body>
  <main class="admin-auth-page">
    <div class="admin-auth-card">
      <div style="text-align: center; margin-bottom: 2rem;">
        <div style="display: inline-block; width: 44px; height: 44px; background: var(--aubergine-800); color: #fff; border-radius: var(--radius-md); line-height: 44px; font-weight: bold; margin-bottom: 0.75rem;">
          🛡️
        </div>
        <h1 style="font-size: 1.5rem; margin-bottom: 0.25rem;">Administrator Access</h1>
        <p class="text-xs text-muted">Governance, scheme verification, & audit log portal.</p>
      </div>

      <form id="admin-login-form">
        <div class="form-group">
          <label class="form-label" for="email">Admin Email</label>
          <input type="email" id="email" class="form-input" placeholder="admin@schemesaathi.in" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-input" placeholder="Enter admin password" required>
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 0.5rem; background-color: var(--aubergine-800);">
          Authorize & Enter
        </button>
      </form>

      <div style="margin-top: 1.5rem; padding: 0.85rem; background: var(--parchment-50); border-radius: var(--radius-md); font-size: var(--text-xs);">
        <div class="font-semibold text-muted" style="margin-bottom: 0.35rem;">Default Seed Credential:</div>
        <code>super@schemesaathi.in / SuperSecret123!</code>
      </div>

      <div style="text-align: center; margin-top: 1.5rem; font-size: var(--text-xs);">
        <a href="/index.html" style="color: var(--color-text-muted);">← Back to Citizen Portal</a>
      </div>
    </div>
  </main>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/components.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submit-btn');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> Authorizing...';

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        try {
          await window.auth.adminLogin(email, password);
          window.showToast('Admin authorization granted.', 'success');
          setTimeout(() => window.location.href = '/admin/dashboard.html', 500);
        } catch (err) {
          btn.disabled = false;
          btn.textContent = 'Authorize & Enter';
        }
      });
    });
  </script>
</body>
</html>
